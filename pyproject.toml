[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-citta-console"
version = "0.1.0"
description = "A universal HTML control panel for agent awareness and action chaining."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "agent-citta-console contributors" }
]
keywords = ["agents", "jsonl", "html", "dashboard", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
citta-console-demo = "examples.generic_jsonl.run_demo:main"

[tool.setuptools.packages.find]
include = ["citta_console*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
